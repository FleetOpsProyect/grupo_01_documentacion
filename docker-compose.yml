# Arranque aislado del servicio de Documentación y Seguros (HU-DOC-11, DAS sec. 10).
# Todas las variables vienen de .env (copia de .env.example).
# Mensajería: AWS SNS + SQS (ADR-DOC-12, ADR-DOC-14; decidido 26-10-2026). Este arquetipo todavía no
# usa AWS: los eventos solo se escriben en el outbox (outbox_events, estado PENDING) y las réplicas de
# vehículos y conductores se cargan con la semilla de desarrollo.
#
# Esquema: sin migraciones en esta versión. PostgreSQL ejecuta los scripts de database/ en orden
# alfabético la PRIMERA vez que arranca con el volumen vacío. Para recrear la base desde cero:
#   docker compose down -v && docker compose up --build

name: fleetops-documents

services:
  documents-db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # PostgreSQL 18+ espera el volumen en /var/lib/postgresql
      - documents-db-data:/var/lib/postgresql
      # Creación del esquema document y del catálogo document_types (DAS sec. 14)
      - ./database/document_schema.sql:/docker-entrypoint-initdb.d/01_document_schema.sql:ro
      # Réplicas de desarrollo: vehículos y conductores de prueba (ADR-DOC-12). Nunca en producción
      - ./database/document_seed_dev.sql:/docker-entrypoint-initdb.d/02_document_seed_dev.sql:ro
    healthcheck:
      # Por TCP (127.0.0.1): mientras se ejecutan los scripts de initdb, PostgreSQL solo escucha por socket
      # local, así que el servicio no arranca antes de que exista el esquema
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - documents-net
    # Acceso desde un cliente de base de datos en esta máquina (DBeaver, pgAdmin, psql) para revisar los datos
    # en desarrollo. Se publica solo en 127.0.0.1: no queda expuesto a la red. Ningún otro servicio de FleetOps
    # accede a esta base (DAS sec. 5)
    ports:
      - "127.0.0.1:${DB_HOST_PORT}:5432"
    restart: unless-stopped

  documents-service:
    image: ${DOCUMENTS_IMAGE:-fleetops-documents:local}
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      documents-db:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT}
      DB_HOST: documents-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS}
      DB_VALIDATION_TIMEOUT_MS: ${DB_VALIDATION_TIMEOUT_MS}
      BUSINESS_TIME_ZONE: ${BUSINESS_TIME_ZONE}
      ALERT_THRESHOLD_DAYS: ${ALERT_THRESHOLD_DAYS}
      LOG_LEVEL: ${LOG_LEVEL}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS}
    ports:
      - "${SERVICE_HOST_PORT}:${SERVER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:$${SERVER_PORT}/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - documents-net
    restart: unless-stopped

volumes:
  documents-db-data:

networks:
  documents-net:
    driver: bridge
