name: CI Pipeline - Documentación y Seguros

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build:
    name: Build y Análisis Sonar
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Necesario para que SonarCloud analice todo el historial

    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Dar permisos al Gradle Wrapper
      run: chmod +x gradlew

    - name: Compilar y correr Pruebas (con cobertura)
      run: ./gradlew build jacocoTestReport

    - name: Análisis con SonarCloud
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: ./gradlew sonarqube \
        -Dsonar.projectKey=FleetOpsProject_grupo_01_documentacion \
        -Dsonar.organization=fleetopsproject \
        -Dsonar.host.url=https://sonarcloud.io