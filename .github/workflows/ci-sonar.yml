# CI del servicio de documentos (HU-DOC-11): lint, typecheck, pruebas con cobertura y análisis en SonarCloud
name: CI Pipeline - Documentación y Seguros

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build y Análisis Sonar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout del código
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # Necesario para que SonarCloud analice todo el historial

    - name: Configurar JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    # Valida el wrapper y guarda en caché las dependencias de Gradle
    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Lint (Checkstyle)
      run: ./gradlew lint

    - name: Typecheck (javac -Xlint:all -Werror)
      run: ./gradlew typecheck

    - name: Pruebas y cobertura del núcleo (100 %)
      run: ./gradlew test jacocoTestCoverageVerification

    # Usa las clases compiladas y el XML de JaCoCo de los pasos anteriores (sonar.gradle.skipCompile=true)
    - name: Análisis con SonarCloud
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: ./gradlew sonar --info

    - name: Reportes
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: reportes
        path: |
          build/reports/checkstyle/
          build/reports/tests/test/
          build/reports/jacoco/test/
          build/test-results/test/
        if-no-files-found: ignore
        retention-days: 14
