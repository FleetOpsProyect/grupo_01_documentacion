plugins {
	id 'java'
	id 'jacoco'
	id 'checkstyle'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.sonarqube' version '7.5.0.8588' 
}

group = 'co.edu.univalle'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Adaptador de entrada REST (DAS sec. 7)
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// Adaptador de salida de persistencia: PostgreSQL con base de datos propia (DAS sec. 5)
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql'
	// Salud y observabilidad: GET /health (HU-DOC-11)
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// Prueba de integración contra PostgreSQL real con los scripts de database/ (DAS sec. 10)
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Lint: config/checkstyle/checkstyle.xml; cualquier violación hace fallar el build
checkstyle {
	toolVersion = '12.3.1'
	maxWarnings = 0
}

// Typecheck: todas las advertencias del compilador son errores
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

tasks.named('bootJar') {
	archiveFileName = 'app.jar'
}

tasks.named('jar') {
	enabled = false
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy 'jacocoTestReport'
}

tasks.register('lint') {
	description = 'Revisa el estilo del código con Checkstyle.'
	group = 'verification'
	dependsOn 'checkstyleMain', 'checkstyleTest'
}

tasks.register('typecheck') {
	description = 'Compila el código principal y el de pruebas con -Xlint:all -Werror.'
	group = 'verification'
	dependsOn 'compileJava', 'compileTestJava'
}

// Cobertura: 100 % de líneas y ramas en las capas de dominio y aplicación (núcleo hexagonal)
jacoco {
	toolVersion = '0.8.14'
}

def coreClasses = ['co/edu/univalle/fleetops/document/service/domain/**',
				   'co/edu/univalle/fleetops/document/service/application/**']

tasks.named('jacocoTestReport') {
	dependsOn 'test'
	reports {
		xml.required = true
		html.required = true
	}
	classDirectories.setFrom(files(classDirectories.files.collect {
		fileTree(dir: it, includes: coreClasses)
	}))
}

tasks.named('jacocoTestCoverageVerification') {
	dependsOn 'test'
	classDirectories.setFrom(files(classDirectories.files.collect {
		fileTree(dir: it, includes: coreClasses)
	}))
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 1.0
			}
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 1.0
			}
		}
	}
}

tasks.named('check') {
	dependsOn 'jacocoTestCoverageVerification'
}

sonar {
    properties {
        property "sonar.projectKey", "FleetOpsProyect_grupo_01_documentacion"
        property "sonar.organization", "fleetopsproyect-1"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml"
    }
}