# Toda la configuración llega por variables de entorno (DAS sec. 5 y 10).
# En local, las variables se leen desde .env (copia de .env.example).
spring:
  application:
    name: fleetops-document-service
  config:
    import: optional:file:.env[.properties]
  profiles:
    # Perfil de ejecución (SPRING_PROFILES_ACTIVE): local (emulador de AWS) o aws (AWS real). Vacío: sin
    # mensajería, como en las versiones anteriores. Se lee también desde .env al ejecutar con bootRun
    active: ${SPRING_PROFILES_ACTIVE:}
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Con la base de datos caída, responder 503 en menos de 2 s (DAS sec. 4.2 y 10)
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crean los scripts de database/ al iniciar el contenedor de PostgreSQL (sin migraciones en
      # esta versión). La aplicación no lo modifica: solo valida al arrancar que las entidades coinciden con él
      ddl-auto: validate
    properties:
      hibernate:
        # Todas las tablas viven en el schema document (DAS sec. 6.4)
        default_schema: document
        jdbc:
          # Solo afecta la conversión JDBC: timestamptz guarda instantes absolutos, sin zona
          time_zone: UTC
  jackson:
    # Datos en snake_case (DAS sec. 6). Las marcas de tiempo salen en ISO 8601 con el desfase de la zona de negocio
    # (America/Bogota, -05:00; DAS sec. 7): los Instant los formatea BusinessTimeZoneJacksonModule
    property-naming-strategy: SNAKE_CASE
    time-zone: ${fleetops.documents.business-time-zone}
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT}
  shutdown: graceful

management:
  endpoints:
    web:
      # Expone el health en GET /health (DAS sec. 7, HU-DOC-11)
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  structured:
    # Logs JSON por salida estándar, con correlation_id desde el MDC (DAS sec. 10). El @timestamp de los logs
    # queda en UTC (decisión P-08 del 08-11-2026), a diferencia de la API y los eventos (-05:00)
    format:
      console: ecs
  level:
    root: ${LOG_LEVEL}

fleetops:
  documents:
    # Zona horaria de la «fecha actual» de negocio (DAS sec. 5, ADR-DOC-01)
    business-time-zone: ${BUSINESS_TIME_ZONE}
    # Umbrales de alerta en días, validados al arrancar (ADR-DOC-09)
    alert-threshold-days: ${ALERT_THRESHOLD_DAYS}
  # Mensajería AWS SNS + SQS (HU-DOC-10, ADR-DOC-12, ADR-DOC-14). Apagada sin perfil: el servicio arranca sin AWS.
  # La activan los perfiles local (emulador Moto, infra/local-aws) y aws (AWS real); ver application-*.yaml
  messaging:
    enabled: false
    consumer:
      # Long polling de ReceiveMessage, de 0 a 20 s (recomendado 20: menos llamadas vacías y menor costo)
      wait-time-seconds: ${MESSAGING_WAIT_TIME_SECONDS}
      # Mensajes por lectura, de 1 a 10
      max-messages: ${MESSAGING_MAX_MESSAGES}
      # Espera antes de reintentar si SQS no responde (HU-DOC-10, criterio 7), por ejemplo 5s
      retry-delay: ${MESSAGING_RETRY_DELAY}
    # Colas propias de Documentación (DAS sec. 8.2); las provisiona infra/local-aws/provision.sh
    queues:
      driver-events: fleetops_document_driver_events_queue
      vehicle-events: fleetops_document_vehicle_events_queue
