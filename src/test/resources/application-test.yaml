# Perfil de pruebas: las pruebas no dependen de .env ni de una base de datos en ejecución.
# Los valores son ficticios y solo sirven para que el contexto de Spring arranque.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fleetops_documents_test
    username: test_user
    password: test_password
    hikari:
      connection-timeout: 1500
      validation-timeout: 1000
  jpa:
    # Hibernate no consulta los metadatos de la base de datos al arrancar ni valida el esquema; la prueba de
    # integración (DocumentRegistrationIT) sí lo valida contra PostgreSQL real
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false

server:
  port: 0

logging:
  level:
    root: INFO

fleetops:
  documents:
    business-time-zone: America/Bogota
    alert-threshold-days: 30,15,7,1
